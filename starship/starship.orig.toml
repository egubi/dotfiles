# Tokyo Night Preset
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg:#1a1b26 fg:#7aa2f7)\
[  ](bg:#7aa2f7 fg:#1a1b26)\
[](fg:#7aa2f7 bg:#3b4261)\
$directory\
[](fg:#3b4261 bg:#434c5e)\
$git_branch\
$git_status\
[](fg:#434c5e bg:#4c566a)\
$nodejs\
$python\
$docker_context\
[](fg:#4c566a bg:#1a1b26)\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "fg:#e0af68 bg:#3b4261"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#434c5e fg:#bb9af7"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#434c5e fg:#f7768e"
format = '[$all_status$ahead_behind ]($style)'
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"

[nodejs]
symbol = ""
style = "bg:#4c566a fg:#9ece6a"
format = '[ $symbol ($version) ]($style)'
detect_files = ["package.json", ".nvmrc", ".node-version"]

[python]
symbol = ""
style = "bg:#4c566a fg:#e0af68"
format = '[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version", "Pipfile"]

[docker_context]
symbol = ""
style = "bg:#4c566a fg:#7dcfff"
format = '[ $symbol $context ]($style)'
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[cmd_duration]
min_time = 2_000
format = "[ took $duration ]($style)"
style = "fg:#e0af68"

[character]
success_symbol = '[](bold fg:#9ece6a)'
error_symbol = '[](bold fg:#f7768e)'

[line_break]
disabled = false
