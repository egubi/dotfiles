# starship.toml

format = """
$custom\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time
$character"""

# Left side - Apple or Server icon
[custom.host_icon]
command = 'echo " "'        # Apple icon (normal)
when = '[[ -z "$SSH_CONNECTION" ]]'
shell = ["bash", "--noprofile", "--norc"]
format = "[$output]($style) "
style = "cyan bold"

[custom.ssh_icon]
command = 'echo "⬡"'        # Server/node icon when SSH
when = '[[ -n "$SSH_CONNECTION" ]]'
shell = ["bash", "--noprofile", "--norc"]
format = "[$output]($style) "
style = "yellow bold"

[directory]
format = "[>](bold cyan) [$path]($style) "
style = "cyan bold"
truncation_length = 3
truncate_to_repo = false

[fill]
symbol = " "

[time]
disabled = false
format = "[✓](green bold) [<](white) [$time](white) [⏱](white)"
time_format = "%H:%M:%S"

[character]
success_symbol = ""
error_symbol = ""

[git_branch]
symbol = ""
style = "bg:#434c5e fg:#bb9af7"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#434c5e fg:#f7768e"
format = '[$all_status$ahead_behind ]($style)'
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"


[cmd_duration]
disabled = true